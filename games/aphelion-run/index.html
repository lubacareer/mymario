<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10151e" />
    <meta name="description" content="Steer a low-flying spacecraft across three floating roads in Aphelion Run, an original Orbit Arcade game." />
    <title>Aphelion Run · Orbit Arcade</title>
  </head>
  <body>
    <main id="cockpit" data-state="menu">
      <header class="flight-bar">
        <a class="library-link" href="%BASE_URL%" aria-label="Library">
          <i class="ph ph-arrow-left" aria-hidden="true"></i><span>Library</span>
        </a>
        <span class="bar-title">Aphelion Run</span>
        <div class="bar-tools">
          <button type="button" class="tool" id="mute" aria-label="Mute sound" title="Mute sound">
            <i class="ph ph-speaker-high" aria-hidden="true"></i>
          </button>
          <button type="button" class="tool" id="pause" aria-label="Pause" title="Pause (Esc)" hidden>
            <i class="ph ph-pause" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <div class="viewport">
        <canvas id="flight-scene" tabindex="-1" aria-label="Aphelion Run flight view"></canvas>
        <section class="selection" id="selection" aria-labelledby="game-title">
          <div class="menu-content">
            <h1 id="game-title">Aphelion<br /><em>Run</em></h1>
            <p class="tagline">Jump the gaps. Cross supply strips to refill fuel and oxygen.</p>
            <div class="course-label"><h2>Course select</h2><span id="course-count"></span></div>
            <div id="courses" role="group" aria-label="Courses"></div>
            <p id="course-description"></p>
            <div class="launch-row">
              <button type="button" id="launch" class="primary"><i class="ph ph-play" aria-hidden="true"></i>Launch course</button>
              <div class="best-label">Best time<strong id="course-best">—</strong></div>
            </div>
            <p class="key-guide"><kbd>←</kbd><kbd>→</kbd> Steer <kbd>↑</kbd><kbd>↓</kbd> Speed <kbd>Space</kbd> Jump</p>
            <p class="touch-guide">Set your speed, then steer and tap Jump with your other thumb.</p>
          </div>
        </section>

        <div id="flight-data" hidden>
          <div class="course-status">
            <div class="live-course"><span id="sector"></span><strong id="current-course"></strong></div>
            <div class="elapsed"><span>Time</span><strong id="clock">0:00.00</strong></div>
          </div>
          <div class="telemetry" aria-label="Flight instruments">
            <div class="readout speed-readout"><span>Speed</span><div><strong id="speed">20</strong><small> m/s</small></div></div>
            <div class="readout"><span>Fuel</span><strong id="fuel">100%</strong><meter id="fuel-meter" min="0" max="100" value="100" aria-label="Fuel"></meter></div>
            <div class="readout"><span>Oxygen</span><strong id="oxygen">100%</strong><meter id="oxygen-meter" min="0" max="100" value="100" aria-label="Oxygen"></meter></div>
            <div class="readout"><span>Course</span><strong id="progress">0%</strong><meter id="progress-meter" min="0" max="100" value="0" aria-label="Course progress"></meter></div>
          </div>
        </div>
        <div role="status" id="announcement" class="announcement"></div>

        <section class="result-layer" id="result" aria-labelledby="result-title" hidden>
          <div class="result-card">
            <div id="result-course" class="eyebrow"></div>
            <h2 id="result-title"></h2>
            <p id="result-description"></p>
            <div class="result-actions">
              <button type="button" id="continue" class="primary"></button>
              <button type="button" id="replay" class="secondary"></button>
              <button type="button" id="select" class="secondary">Course select</button>
            </div>
          </div>
        </section>
      </div>

      <div id="touch-deck" aria-label="Flight controls" hidden>
        <div class="pad-group">
          <button type="button" data-pad="left" aria-label="Steer left">←</button>
          <button type="button" data-pad="right" aria-label="Steer right">→</button>
        </div>
        <div class="pad-group throttle">
          <button type="button" data-pad="slower" aria-label="Decrease speed">−</button>
          <button type="button" data-pad="faster" aria-label="Increase speed">+</button>
        </div>
        <button type="button" class="jump-pad" data-pad="jump" aria-label="Jump">Jump</button>
      </div>
    </main>
    <script type="module" src="/src/aphelion/main.ts"></script>
  </body>
</html>
