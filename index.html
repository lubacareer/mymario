<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f2e8" />
    <meta name="description" content="Play Bellwind Post and Aphelion Run, two original browser games for keyboard and touch." />
    <title>Orbit Arcade · Game library</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23212a29'/%3E%3Cg transform='rotate(-32 32 32)' fill='%23ff7043'%3E%3Ccircle cx='32' cy='32' r='15'/%3E%3Cellipse cx='32' cy='32' rx='27' ry='6' fill='none' stroke='%23ff7043' stroke-width='4'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/library.css" />
  </head>
  <body>
    <main class="library">
      <header class="library-head">
        <div class="identity"><span class="orbit" aria-hidden="true"></span><h1>Orbit <em>Arcade</em></h1></div>
        <p class="controls-info">Keyboard &amp; touch</p>
      </header>
      <section aria-labelledby="library-title">
        <div class="shelf"><h2 id="library-title">Game library</h2><span>02 games</span></div>
        <div class="games">
          <a class="game post" href="./games/bellwind-post/" aria-label="Play Bellwind Post">
            <div class="cover">
              <img class="couriers" src="/art/couriers.webp" width="970" height="1024" alt="" />
            </div>
            <div class="details">
              <span class="genre">Platformer</span>
              <h3>Bellwind <em>Post</em></h3>
              <p>Carry the mail across sky islands and into the Cloud Carnival with Nia or Finn.</p>
              <span class="play">Play Bellwind Post <span aria-hidden="true">↗</span></span>
            </div>
          </a>
          <a class="game run" href="./games/aphelion-run/" aria-label="Play Aphelion Run">
            <div class="cover">
              <img class="racer" src="/art/aphelion-run.webp" alt="" />
            </div>
            <div class="details">
              <span class="genre">Space racer</span>
              <h3>Aphelion <em>Run</em></h3>
              <p>Pilot a starship across broken orbital roads in a three-course cup.</p>
              <span class="play">Play Aphelion Run <span aria-hidden="true">↗</span></span>
            </div>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
